name: Build and push .NET template

on:
  release:
    types: [published]
  schedule:
    # .NET servicing patches ship on the second Tuesday of the month; rebuilding
    # on the 15th picks them up (the SDK is installed by channel, not version).
    - cron: '17 4 15 * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-push-dotnet
  cancel-in-progress: false

jobs:
  # One job per tag: they push disjoint tags, so they parallelise safely and a
  # broken :8 build doesn't hold back :10.
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ['10', '8']
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A release builds a fresh commit, so `<tag>-<shortsha>` is already unique.
      # A scheduled rebuild runs against an unchanged commit, so it needs a
      # suffix or it would overwrite the previous build's immutable tag.
      - name: Resolve immutable tag suffix
        id: suffix
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            echo "value=-r$(date -u +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        env:
          IMMUTABLE_SUFFIX: ${{ steps.suffix.outputs.value }}
        run: scripts/build-push.sh '${{ matrix.tag }}'
